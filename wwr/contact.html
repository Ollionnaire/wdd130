<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting today. Find our phone number, email address, location, and send us a message using our contact form.">
    <meta name="author" content="Oliver Khensky Ocxilas">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us</title>
</head>
<body>
    <header>
        <img src="images/logo.jpg" alt="the logo of the white water rafting company">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <section class="contact">
                <h1>OKO Rafting Journey</h1>
                <p>4, Imp. J. Vincent, Clercine 2</p>
                <p>Port-au-Prince, Haiti</p>
                <p>(509)3189-2877</p>
                <p>ocxilaskhensky05@gmail.com</p>
            </section>
            <section class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15127.311167423408!2d-72.2955913!3d18.581800949999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2sht!4v1795832079957!5m2!1sfr!2sht" width="450" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" class="name" placeholder="placeholder" required>

                <label for="email">Email:</label>
                <input type="text" id="email" class="email" placeholder="placeholder" required>

                <div class="radio-items">
                    <label>Message Purpose</label>

                    <label for="general">General Inquiry</label>
                    <input type="radio" id="general" name="purpose" value="General Inquiry">
                    <label for="reservation">Reservation Question</label><br>
                    <input type="radio" id="reservation" name="purpose" value="Reservation Question">
                    <label for="suggestion">Website Suggestion</label>
                    <input type="radio" id="suggestion" name="purpose" value="Website Suggestion">
                </div>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label for="newsletter">Please subscribe me to the monthly newsletter </label>
                <input type="checkbox" id="newsletter" name="newsletter">

                <button type="submit">Get in touch</button>
            </form> 
        </div>
        <section class="adventures">
            <h2>We are here to serve you!</h2>
            <figure class="employee">
                <img src="images/employee1.jpg" alt="John Carter - Senior River Guide">
                <figcaption>Pamela Carter - Seniora River Guide</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/employee2.jpg" alt="Big Mallard">
                <figcaption>Oliva Bergrave</figcaption>
            </figure>
            <figure class="employee">
                <img src="images/employee3.jpg" alt="Half Day Adventure">
                <figcaption>Zephete John Peter</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026💧OKO Rafting Journey💧Oliver Khensky Ocxilas</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>   
</body>
</html>
