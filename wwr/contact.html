<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Whitewater rafting is a type of recreation that involves navigating a non-motorized watercraft down free flowing rivers.">
    <meta name="author" content="Oliver Khensky OCXILAS">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us</title>
</head>
<body>
    <header>
        <img src="images/z-crossedoars.jpeg" alt="WWR Samples logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact">
            <h1>White Water Rafting Company</h1>
            <p>41000, C. la piña</p>
            <p>République dominicaine</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30885768.006991055!2d-109.68710870000002!3d19.097328400000006!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8eb03109372372b5%3A0x4de9ce3ad2852274!2sJaraventura%20-%20Rafting%20Tubing%20Canyoning%20Senderismo!5e0!3m2!1sfr!2sht!4v1770676558889!5m2!1sfr!2sht" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form class="contact-form">

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="p1" name="name" placeholder="Placeholder">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="p2" name="email" placeholder="Placeholder">
                </div>

                <div class="form-group">
                    <label for="message-purpose">Message Purpose:</label>
                    <div class="radio-group">
                        <label><input type="radio" id="p3" name="purpose" value="general"> General Inquiry</label>
                        <label><input type="radio" id="p3" name="purpose" value="reservation"> Reservation Question</label>
                        <label><input type="radio" id="p3" name="purpose" value="website"> Website Suggestion</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="p4" placeholder="Type here"></textarea>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="p5" name="checkbox">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section>
           <h2>We Are Here to Serve You!</h2>
           <aside>
                <figure>
                        <img src="images/rafting_employee_000.jpg" alt="Rafting trip">
                        <figcaption>Deliver a seamless customer experience.</figcaption>
                </figure>
                <figure>
                        <img src="images/Rafting_employee_001.jpg" alt="Rafting trip">
                        <figcaption>Optimize the customer journey..</figcaption>
                </figure>
                <figure>
                        <img src="images/rafting_employee_002.jpg" alt="Rafting trip">
                        <figcaption>Ensure customer satisfaction at every touchpoint.</figcaption>
                </figure>
            </aside>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | WhiteWater Rafting Company | Oliver Khensky OCXILAS.</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.webp" alt="Facebook Logo" width="30">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.webp" alt="Instagram Logo" width="30">
            </a>
            <a href="https://www.twitter.com">
                <img src="images/twitter.webp" alt="Twitter Logo" width="30">
            </a>
        </nav>
    </footer>
</body>
</html>
