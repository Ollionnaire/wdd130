<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page web is to work on the code along activity for the WDD 130 Week 05">
    <meta name="author" content="Oliver Khensky Ocxilas">
    <link rel="stylesheet" href="styles/quiz.css">
    <title> Quiz Form</title>
</head>
<body>
    <main>
        <h1>HTML Basic and CSS Quiz</h1>
        <form>
            <div class="q1">
                <label for="q1">1.What does the accronym CSS stand for? </label>
                <input type="text" id="q1" name="q1">
            </div>
            <div>
                <label for="message">2.How are id and class attribute selected in CSS?</label>
                <textarea id="q2" name="q2" row="4"></textarea>
            </div>
            <div>
                <label for="comment">3.Which of the following is a valid CSS comment</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="/lol/">/lol/</option>
                    <option value="#lol">#lol</option>
                    <option value="/*lol*/">/*lol*/</option>
                    <option value="#/loll#/">#/loll#/</option>
                </select>
            </div>
            <div>
                <label for="text">4.What is the bottom margin of this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input  type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>   
    </main>
</body>
</html>
