<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="code along activity week05 is about to build an HTML form that has at least 4 questions about HTML and/or CSS.">
    <meta name="author" content="Oliver Khensky OCXILAS">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>HTML & CSS Quiz</title>
</head>
<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <ol>
                <li>
                    <label for="input">What does the accronyme CSS stand for?</label>
                    <input type="text" id="q1" name="q1">
                </li>   
                <li>
                    <label for="input">How are id and class attribute selected in CSS?</label>
                    <textarea id="q2" name="q2" rows="4"></textarea>
                </li>
                <li>
                    <label for="input">Which of the following is a valid CSS comment?</label>
                    <select id="q3" name="q3">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="1">/* This is a comment */</option>
                        <option value="2">// This is a comment</option>
                        <option value="3"># This is a comment</option>
                    </select>
                </li>
                <li>
                    <label for="input">Which of the following is a valid HTML element?</label>
                        <p>margin: 10px 5px 15px;</p>
                    <input type="number" id="q4" name="q4">
                </li>
            </ol>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>
</html>
