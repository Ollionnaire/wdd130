<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple poll form to collect user information and preferences.">
    <meta name="author" content="Oliver Khensky OCXILAS">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>Form Activity</title>
</head>
<body>
    <header>
        <h1> WDD 130 | HTML Form - User Poll</h1>

    </header>
    <main>
        <form>
            <article>
                <h2>Contact Information</h2>
                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div> 
                <div class="form-item column2">  
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </article>
            <article>
                <h2>Questions</h2>
                <div class="form-item column1">
                    <label for="browser">What is your favorite internet browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet"> 
                </div>
                <div class="form-item">
                    <label for="feedback">List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                </div>
            </article>  
            <button type="submit">Submit Poll</button>
        </form>

    </main>
    <footer>
        <p>&copy; 2026 |HTML Form - User Poll Activity | Oliver Khensky OCXILAS</p>
    </footer>
</body>
</html>
